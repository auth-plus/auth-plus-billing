[package]
name = "auth-plus-billing"
version = "0.1.0"
edition = "2024"
authors = ["Andrew Hanasiro <andrewkhanasiro@gmail.com>"]
description = "A billing system"
repository = "https://github.com/auth-plus/auth-plus-billing"
readme = "README.md"
license = "MIT"
default-run = "http"

[[bin]]
name = "http"
test = false
bench = false

[[bin]]
name = "kafka"
test = false
bench = false

[[bin]]
name = "cronjob"
test = false
bench = false

[dependencies]
actix-cors = "0.7.2"
actix-service = "2.0.3"
actix-web = "4.15.0"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
lazy_static = "1.5.0"
log = "0.4.34"
mockall = "0.15.0"
opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", features = ["grpc-tonic", "metrics", "trace", "logs", "tls-roots", "gzip-tonic"] }
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
rust_decimal = { version = "1.43.0", features = ["db-postgres"] }
rust_decimal_macros = "1.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", features = [
    "postgres",
    "uuid",
    "json",
    "time",
    "macros",
    "rust_decimal",
    "runtime-tokio",
] }
tokio = { version = "1.52.0", features = ["full"] }
tracing = "0.1.43"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tracing-opentelemetry = "0.34.0"
tonic = { version = "0.14", features = ["tls-native-roots", "gzip"] }
tracing-actix-web = "0.7.25"
actix-rt = "2.15.0"
fake = "5.1.0"
time = { version = "0.3.47", features = ["macros"] }
opentelemetry_sdk = "0.33.0"
reqwest = { version = "0.13.5", features = ["json"] }
anyhow = "1.0.102"
httpmock = "0.8.3"
redis = { version = "1.7.1", features = [] }
opentelemetry-appender-tracing = "0.33.0"

[dev-dependencies]
actix-rt = "2.10"
fake = { version = "5.1.0", features = ['uuid'] }
